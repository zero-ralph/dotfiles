# i3blocks config - dark + orange theme (styled after the Archcraft i3 look)
# Each group of blocks is drawn as a "pill": blocks share a dark background,
# and a #1b1e25 border on the top and bottom (same color as the bar) insets it.
# Groups are separated by giving the last block of a group a separator_block_width.
# Icons are FontAwesome 4.7: https://fontawesome.com/v4.7/cheatsheet/

# Global properties (every block, can be overridden)
separator=false
separator_block_width=0
markup=pango
color=#d4d7dd
background=#2b303b
border=#1b1e25
border_top=4
border_bottom=4
border_left=0
border_right=0

# ---- spotify --------------------------------------------------------------
# Spotify controls (needs playerctl), play starts spotify if it isn't running
[pad]
full_text= 

[spotify-prev]
command=[ -n "$button" ] && playerctl -p spotify previous; echo "  "
interval=once
color=#ff8c52

[spotify-play]
command=~/.config/i3/scripts/spotify-play
interval=2
color=#ff8c52

[spotify-next]
command=[ -n "$button" ] && playerctl -p spotify next; echo "  "
interval=once
color=#ff8c52

[pad]
full_text= 

# Spacer that pushes the spotify controls toward the middle of the bar,
# and shows the current song inside it while playing.
# $SPACER (pixels) is set per monitor in the bar {} blocks of the i3 config.
[spotify-spacer]
command=[ -n "$button" ] && ~/.config/i3/scripts/spotify-start --focus; ~/.config/i3/scripts/spotify-song
format=json
interval=2
signal=10
color=#ff8c52
background=#1b1e25

# ---- system ---------------------------------------------------------------
[pad]
full_text= 

[memory]
label=<span color='#ff8c52'></span> 
command=~/.config/i3/scripts/memory
interval=2

[gap]
full_text=  

[cpu_usage]
label=<span color='#ff8c52'></span> 
command=~/.config/i3/scripts/cpu_usage
interval=2

[gap]
full_text=  

# the script prints its own thermometer icon
[CPU-temperature]
command=~/.config/i3/scripts/temperature
interval=30

[pad]
full_text= 
separator_block_width=8

# ---- network --------------------------------------------------------------
[pad]
full_text= 

[bandwidth]
UNIT=Kb
min_width=⇄ 99999/99999 Kbps
align=center
command=~/.config/i3/scripts/bandwidth2
interval=persist

[pad]
full_text= 
separator_block_width=8

# ---- audio ----------------------------------------------------------------
[pad]
full_text= 

[pavucontrol]
full_text=<span color='#ff8c52'></span>  
command=pavucontrol

[volume]
command=~/.config/i3/scripts/volume
interval=2

[pad]
full_text= 
separator_block_width=8

# ---- power profile --------------------------------------------------------
# power-profiles-daemon: click the bolt to pick a profile
[pad]
full_text= 

[ppd_menu]
full_text=<span color='#ff8c52'></span> 
command=~/.config/i3/scripts/power-profiles

[ppd-status]
command=~/.config/i3/scripts/ppd-status
interval=5

[pad]
full_text= 
separator_block_width=8

# ---- clock ----------------------------------------------------------------
[pad]
full_text= 

[time]
label=<span color='#ff8c52'></span> 
command=date '+%a %d %b  %H:%M'
interval=5
color=#ff8c52

[pad]
full_text= 
separator_block_width=8

# ---- power menu -----------------------------------------------------------
[shutdown_menu]
full_text=    
color=#1b1e25
background=#ff8c52
command=~/.config/i3/scripts/powermenu

# Stands in for the bar's right padding (removed in the i3 config because
# i3bar ignores it when mapping clicks, which shifted every click ~8px)
[edge]
full_text= 
background=#1b1e25
border=#1b1e25
